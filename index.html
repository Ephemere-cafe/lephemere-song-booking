<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曇時 咖啡廳預約</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');

*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(192,123,138,0.10),transparent 42%),
    var(--ink-deep);
  font-family:'Noto Sans TC',sans-serif;
  font-size:15px;
  line-height:1.65;
}
:root{
  --ink:#241f30; --ink-deep:#191420; --card:#2d2738;
  --parchment:#f3ece1; --parchment-dim:#c7bfae;
  --gold:#caa06b; --gold-dim:#8a6f4d;
  --rose:#c07b8a; --rose-dim:#7a4d57;
  --sage:#8fa688; --sage-dim:#4d5c48;
  --mist:#a79bc4; --line:rgba(243,236,225,0.12);
}
.wrap{
  background:var(--ink);
  color:var(--parchment);
  padding:40px 36px 52px;
  border-radius:18px;
  max-width:760px;
  margin:24px auto;
  position:relative;
  overflow:hidden;
  min-height:calc(100vh - 48px);
  box-shadow:0 24px 70px rgba(0,0,0,0.24);
}
.booking-intro{position:relative;z-index:1;margin-bottom:20px;}
.booking-intro h2{font-family:'Noto Serif TC',serif;font-size:21px;color:var(--gold);margin:0 0 7px;letter-spacing:.04em;}
.booking-intro p{font-size:14px;color:var(--parchment-dim);margin:0;line-height:1.8;}
.booking-top-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start;margin-bottom:20px;}
.booking-top-grid .panel{height:100%;margin-bottom:0;}
.staff-empty{font-size:14px;color:var(--parchment-dim);line-height:1.7;}
.booking-main .panel{margin-bottom:20px;}
.booking-main .panel:last-child{margin-bottom:0;}
@media (min-width:860px){
  .wrap{max-width:1080px;}
}
.petal{
  position:absolute; width:10px; height:10px; border-radius:0 60% 0 60%;
  background:var(--rose); opacity:0.18; animation:fall linear infinite;
}
@keyframes fall{from{transform:translateY(-20px) rotate(0deg);} to{transform:translateY(420px) rotate(200deg);}}

.header{
  position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:30px; padding-bottom:22px; border-bottom:1px solid var(--line);
}
.brand h1{font-family:'Noto Serif TC',serif;font-weight:600;font-size:27px;margin:0 0 4px;letter-spacing:0.03em;}
.brand p{margin:0;font-size:13px;color:var(--parchment-dim);letter-spacing:0.08em;}
.clock{text-align:right;font-size:13px;color:var(--parchment-dim);}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;}
.dot.online{background:var(--sage);}
.dot.offline{background:var(--rose);}

.panel{
  position:relative;
  z-index:1;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px 24px;
  margin-bottom:20px;
  box-shadow:0 12px 32px rgba(0,0,0,0.10);
}
.panel-title{
  font-family:'Noto Serif TC',serif;
  font-size:14px;
  font-weight:600;
  color:var(--mist);
  letter-spacing:0.07em;
  margin:0 0 16px;
  text-transform:uppercase;
}
.full-notice{
  display:flex;
  flex-direction:column;
  gap:7px;
  width:100%;
  padding:18px 20px;
  border:1px solid rgba(192,123,138,0.48);
  border-radius:8px;
  background:rgba(192,123,138,0.10);
}
.full-notice strong{
  color:var(--rose);
  font-family:'Noto Serif TC',serif;
  font-size:17px;
  letter-spacing:0.05em;
}
.full-notice span{color:var(--parchment-dim);font-size:14px;line-height:1.7;}
#dateList{display:flex;flex-wrap:wrap;gap:10px;}

#rulesContent > *:first-child{margin-top:0;}
.rules-title{
  text-align:center; font-family:'Noto Serif TC',serif; font-weight:600;
  font-size:18px; color:var(--gold); letter-spacing:0.08em; margin:2px 0 18px;
}
.rules-h2{
  font-weight:700; color:var(--gold); font-size:15px; letter-spacing:0.03em;
  margin:20px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);
}
.rules-h2-plain{ color:var(--rose); border-bottom-color:rgba(192,123,138,0.28); }
.rules-highlight{
  font-weight:600; color:var(--parchment); background:rgba(202,160,107,0.08);
  border-left:2px solid var(--gold-dim); padding:6px 10px; border-radius:0 6px 6px 0;
  margin:16px 0 8px; font-size:14px;
}
.rules-li{ display:flex; gap:9px; align-items:flex-start; margin:5px 0 5px 4px; font-size:14px; color:var(--parchment-dim); }
.rules-dot{ flex:none; width:5px; height:5px; border-radius:50%; background:var(--gold-dim); margin-top:7px; }
.rules-p{font-size:14px;color:var(--parchment-dim);margin:3px 0 8px;line-height:1.8;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

input[type=text]{
  background:var(--ink-deep);border:1px solid var(--line);color:var(--parchment);
  min-height:46px;border-radius:9px;padding:11px 13px;font-size:16px;font-family:inherit;
}
input::placeholder{color:var(--parchment-dim);}
input:focus,select:focus{outline:2px solid rgba(202,160,107,0.28);outline-offset:1px;border-color:var(--gold);}

.btn{min-height:44px;background:transparent;border:1px solid var(--gold-dim);color:var(--gold);border-radius:9px;padding:10px 18px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;}
.btn:hover{background:rgba(202,160,107,0.1);}
.btn.primary{background:var(--gold-dim);color:var(--ink-deep);border-color:var(--gold-dim);font-weight:500;}
.btn.primary:hover{background:var(--gold);}
.btn.ghost{border-color:var(--line);color:var(--parchment-dim);}
.btn.ghost:hover{color:var(--parchment);border-color:var(--parchment-dim);}
.btn.small{padding:8px 14px;font-size:13px;}

.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--ink-deep);
  min-height:44px;border:1px solid var(--line);border-radius:24px;padding:10px 17px;font-size:15px;
  cursor:pointer;margin:0;
}
.chip:hover{border-color:var(--gold-dim);color:var(--gold);}
.chip .artist{color:var(--parchment-dim);font-size:12px;}

.staff-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--ink-deep);
  border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:14px;
}
.staff-chip .role{color:var(--mist);font-size:12px;}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--parchment-dim);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:13px;flex-shrink:0;}
.icon-btn:hover{color:var(--parchment);border-color:var(--parchment-dim);}

.selected-song{
  display:flex;justify-content:space-between;align-items:center;background:var(--ink-deep);
  border:1px solid var(--gold-dim);border-radius:9px;padding:11px 14px;margin-bottom:8px;font-size:14px;
}

.configwarn{position:relative;z-index:1;background:#3a2b2b;border:1px solid var(--rose-dim);color:var(--parchment);border-radius:10px;padding:15px 17px;margin-bottom:18px;font-size:14px;line-height:1.7;}

@media (max-width:640px){
  body{background:var(--ink);}
  .wrap{
    width:100%;
    min-height:100vh;
    margin:0;
    padding:24px 14px 36px;
    border-radius:0;
    box-shadow:none;
  }
  .header{align-items:flex-start;margin-bottom:22px;padding:0 4px 18px;}
  .brand h1{font-size:22px;}
  .brand p,.clock{font-size:12px;}
  .panel{padding:18px 16px;border-radius:12px;margin-bottom:16px;}
  .panel-title{font-size:13px;margin-bottom:14px;}
  .booking-top-grid{grid-template-columns:1fr;gap:16px;margin-bottom:16px;}
  .booking-main .panel{margin-bottom:16px;}
  #bookingForm input[type=text],
  #bookingForm select{
    width:100%!important;
    min-width:0!important;
    flex:1 1 100%!important;
    min-height:46px;
    font-size:16px!important;
  }
  #bookingForm .row .btn{flex:1 1 120px;}
  .full-notice{padding:16px;}
  .full-notice strong{font-size:16px;}
  .chip{width:100%;justify-content:center;}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="header">
    <div class="brand">
      <h1>曇時 Cafe l'Éphémère</h1>
      <p>咖啡廳預約</p>
    </div>
    <div class="clock">
      <div><span class="dot offline" id="connDot"></span><span id="connText">連線中...</span></div>
    </div>
  </div>

  <div id="configWarn" class="configwarn" style="display:none;">
    尚未設定 Firebase 連線資訊，請在程式碼中填入 firebaseConfig 後重新上傳。
  </div>

  <div class="booking-intro">
    <h2>選擇今晚的預約時段</h2>
    <p>每個營業時段僅接待一組主人。請先選擇日期，系統會顯示當日值班人員與可指名的女僕。</p>
  </div>

  <div class="booking-top-grid">
      <div class="panel">
        <p class="panel-title">可預約日期（一天僅接一組）</p>
        <div id="dateList"><span style="color:var(--parchment-dim);font-size:14px;">目前沒有開放的預約日期</span></div>
      </div>

      <div class="panel" id="todayStaffPanel">
        <p class="panel-title" id="todayStaffTitle">選擇日期後顯示值班人員</p>
        <div id="todayStaffContent"><span class="staff-empty">請先從左側選擇想預約的日期。</span></div>
      </div>
  </div>

  <div class="booking-main">
      <div class="panel" id="bookingForm" style="display:none;">
        <p class="panel-title">填寫預約資料 · <span id="selectedDateLabel"></span></p>
        <div class="row">
          <input type="text" id="bookName" placeholder="角色名／稱呼" style="flex:1;min-width:120px;">
          <input type="text" id="bookSizeInput" placeholder="人數" style="width:70px;">
        </div>
        <div class="row" style="margin-top:8px;">
          <select id="bookMaid" style="flex:1;min-width:160px;background:var(--ink-deep);border:1px solid var(--line);color:var(--parchment);border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit;">
            <option value="">指名女僕（選填）</option>
          </select>
        </div>
        <div class="row" style="margin-top:8px;">
          <input type="text" id="bookNote" placeholder="備註（選填）" style="flex:1;min-width:120px;">
        </div>

        <p class="panel-title" style="margin-top:18px;">自由點歌（最多3首，需附原曲網址）</p>
        <div class="row" style="margin-top:10px;">
          <input type="text" id="customSongTitle" placeholder="歌名" style="flex:1;min-width:120px;">
          <input type="text" id="customSongUrl" placeholder="原曲網址（必填）" style="flex:1;min-width:160px;">
          <button class="btn ghost small" id="addCustomSong">加入</button>
        </div>

        <div id="selectedSongsList" style="margin-top:10px;"></div>

        <div class="row" style="margin-top:14px;">
          <button class="btn primary" id="submitBooking">確認預約</button>
          <button class="btn ghost" id="cancelBookingForm">取消</button>
        </div>
        <p id="bookingError" style="font-size:13px;color:var(--rose);margin:10px 0 0;display:none;"></p>
      </div>
      <div class="panel" id="rulesPanel" style="display:none;">
        <p class="panel-title">預約須知</p>
        <div id="rulesContent" style="font-size:14px;line-height:1.8;color:var(--parchment);"></div>
      </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function(){

  var firebaseConfig = {
    apiKey: "AIzaSyAPIpmaLgXp3TVTV7y-yrH63xkMtAuYMSQ",
    authDomain: "lephemere-queue-c38d5.firebaseapp.com",
    databaseURL: "https://lephemere-queue-c38d5-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "lephemere-queue-c38d5",
    storageBucket: "lephemere-queue-c38d5.firebasestorage.app",
    messagingSenderId: "35595928973",
    appId: "1:35595928973:web:36a8a4695fd293061d29c4"
  };

  var isConfigured = firebaseConfig.apiKey.indexOf('貼上') === -1;
  if(!isConfigured){ document.getElementById('configWarn').style.display = 'block'; }

  var openDates = {};
  var reservations = {};
  var staffRoster = {};
  var todayStaff = {};
  var staffSchedules = {};
  var webhookUrl = '';
  var selectedDate = null;
  var selectedSongs = []; // [{title, url}]
  var db, openDatesRef, reservationsRef, webhookRef, rulesRef, staffRosterRef, todayStaffRef, staffSchedulesRef;

  function petals(){
    var wrap = document.getElementById('wrap');
    for(var i=0;i<6;i++){
      var p = document.createElement('div');
      p.className='petal';
      p.style.left=(Math.random()*100)+'%';
      p.style.animationDuration=(10+Math.random()*8)+'s';
      p.style.animationDelay=(Math.random()*10)+'s';
      wrap.appendChild(p);
    }
  }
  petals();

  function tickClock(){
    var d=new Date();
    document.getElementById('connText').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  tickClock();
  setInterval(tickClock,15000);

  function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  function formatRulesText(text){
    var lines = text.split('\n');
    var html = '';
    for(var i=0;i<lines.length;i++){
      var line = lines[i].trim();
      if(line === '') continue;
      var esc = escapeHtml(line);
      if(/^[◆♦].+[◆♦]$/.test(line)){
        html += '<div class="rules-title">' + escapeHtml(line.replace(/^[◆♦]\s*/,'').replace(/\s*[◆♦]$/,'')) + '</div>';
      } else if(/^【.+】$/.test(line)){
        html += '<div class="rules-h2">' + esc + '</div>';
      } else if(/^[・\-]\s?/.test(line)){
        html += '<div class="rules-li"><span class="rules-dot"></span><span>' + escapeHtml(line.replace(/^[・\-]\s?/,'')) + '</span></div>';
      } else if(/^[\u2600-\u27BF\u{1F300}-\u{1FAFF}]/u.test(line)){
        html += '<div class="rules-highlight">' + esc + '</div>';
      } else if(line.length <= 12 && !/[：:。，,]/.test(line)){
        html += '<div class="rules-h2 rules-h2-plain">' + esc + '</div>';
      } else {
        html += '<div class="rules-p">' + esc + '</div>';
      }
    }
    return html;
  }

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function formatDateLabel(dateStr){
    if(!dateStr) return '';
    var parts = dateStr.split('-');
    if(parts.length !== 3) return dateStr;
    return parts[1].replace(/^0/,'') + '/' + parts[2].replace(/^0/,'');
  }

  if(isConfigured){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    openDatesRef = db.ref('lephemere/openDates');
    reservationsRef = db.ref('lephemere/reservations');
    webhookRef = db.ref('lephemere/webhookUrl');
    rulesRef = db.ref('lephemere/rules');
    staffRosterRef = db.ref('lephemere/staffRoster');
    todayStaffRef = db.ref('lephemere/todayStaff');
    staffSchedulesRef = db.ref('lephemere/staffSchedules');

    db.ref('.info/connected').on('value', function(snap){
      document.getElementById('connDot').className = snap.val()===true ? 'dot online' : 'dot offline';
    });

    webhookRef.on('value', function(snap){ webhookUrl = snap.val() || ''; });

    rulesRef.on('value', function(snap){
      var text = snap.val() || '';
      var panel = document.getElementById('rulesPanel');
      if(text.trim()){
        document.getElementById('rulesContent').innerHTML = formatRulesText(text);
        panel.style.display = 'block';
      }else{
        panel.style.display = 'none';
      }
    });

    staffRosterRef.on('value', function(snap){
      staffRoster = snap.val() || {};
      renderMaidOptions();
      renderTodayStaff();
    });

    todayStaffRef.on('value', function(snap){
      todayStaff = snap.val() || {};
      renderMaidOptions();
      renderTodayStaff();
    });

    staffSchedulesRef.on('value', function(snap){
      staffSchedules = snap.val() || {};
      renderMaidOptions();
      renderTodayStaff();
    });

    openDatesRef.on('value', function(snap){
      openDates = snap.val() || {};
      renderDateList();
    });

    reservationsRef.on('value', function(snap){
      reservations = snap.val() || {};
      renderDateList();
    });
  }

  // ---------- staff ----------
  function renderMaidOptions(){
    var sel = document.getElementById('bookMaid');
    var current = sel.value;
    var schedule = selectedDate && staffSchedules[selectedDate];
    var legacySchedule = selectedDate && todayStaff.date===selectedDate && Array.isArray(todayStaff.staffIds) ? todayStaff : null;
    if(!schedule && legacySchedule) schedule = legacySchedule;
    var hasSchedule = !!(schedule && Array.isArray(schedule.staffIds));
    var keys = hasSchedule
      ? schedule.staffIds.filter(function(id){ return !!staffRoster[id]; })
      : Object.keys(staffRoster);
    var excluded = ['店長','樂手'];
    var maidKeys = keys.filter(function(k){
      var role = (staffRoster[k].role || '').trim();
      return excluded.indexOf(role) === -1;
    });
    var useKeys = hasSchedule ? maidKeys : (maidKeys.length ? maidKeys : keys);
    var html = '<option value="">指名女僕（選填）</option>';
    if(hasSchedule && useKeys.length===0){
      html += '<option value="" disabled>此時段沒有可指名的女僕</option>';
    }
    useKeys.forEach(function(k){
      var s = staffRoster[k];
      html += '<option value="'+escapeHtml(s.name)+'">'+escapeHtml(s.name)+(s.role?'（'+escapeHtml(s.role)+'）':'')+'</option>';
    });
    sel.innerHTML = html;
    if(useKeys.some(function(k){ return staffRoster[k].name === current; })) sel.value = current;
  }

  function renderTodayStaff(){
    var panel = document.getElementById('todayStaffPanel');
    var el = document.getElementById('todayStaffContent');
    var titleEl = document.getElementById('todayStaffTitle');
    var displayDate = selectedDate;
    if(!displayDate){
      titleEl.textContent = '選擇日期後顯示值班人員';
      el.innerHTML = '<span class="staff-empty">請先選擇想預約的日期。</span>';
      panel.style.display = 'block';
      return;
    }
    var schedule = displayDate && staffSchedules[displayDate];
    var staffIds = schedule && Array.isArray(schedule.staffIds)
      ? schedule.staffIds
      : (todayStaff.date===displayDate ? (todayStaff.staffIds||[]) : []);
    if(!staffIds.length){
      titleEl.textContent = formatDateLabel(displayDate)+' 值班人員';
      el.innerHTML = '<span class="staff-empty">此日期尚未公布排班，指名女僕將暫不開放。</span>';
      panel.style.display = 'block';
      return;
    }
    var html = '';
    staffIds.forEach(function(id){
      var s = staffRoster[id];
      if(!s) return;
      html += '<span class="staff-chip">'+escapeHtml(s.name)+(s.role?' <span class="role">'+escapeHtml(s.role)+'</span>':'')+'</span>';
    });
    if(!html){
      titleEl.textContent = formatDateLabel(displayDate)+' 值班人員';
      el.innerHTML = '<span class="staff-empty">此日期尚未公布排班，指名女僕將暫不開放。</span>';
      panel.style.display = 'block';
      return;
    }
    titleEl.textContent = formatDateLabel(displayDate) + ' 在班店員';
    el.innerHTML = html;
    panel.style.display = 'block';
  }

  // ---------- song selection (max 3) ----------
  function addSelectedSong(song){
    if(selectedSongs.length >= 3) return;
    selectedSongs.push(song);
    renderSelectedSongs();
  }
  function removeSelectedSong(index){
    selectedSongs.splice(index,1);
    renderSelectedSongs();
  }
  function renderSelectedSongs(){
    var el = document.getElementById('selectedSongsList');
    if(selectedSongs.length===0){ el.innerHTML = '<span style="font-size:14px;color:var(--parchment-dim);">尚未選擇歌曲（最多3首）</span>'; return; }
    var html = '';
    selectedSongs.forEach(function(s, i){
      html += '<div class="selected-song"><span>'+escapeHtml(s.title)+(s.url?' <a href="'+escapeHtml(s.url)+'" target="_blank" rel="noopener" style="color:var(--gold);font-size:12px;">原曲連結</a>':'')+'</span>'
        + '<button class="icon-btn" data-remove-selected="'+i+'">✕</button></div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('[data-remove-selected]').forEach(function(btn){
      btn.addEventListener('click', function(){ removeSelectedSong(parseInt(btn.getAttribute('data-remove-selected'),10)); });
    });
  }

  document.getElementById('addCustomSong').addEventListener('click', function(){
    var title = document.getElementById('customSongTitle').value.trim();
    var url = document.getElementById('customSongUrl').value.trim();
    var errEl = document.getElementById('bookingError');
    if(!title || !url){
      errEl.textContent = '自行輸入的歌曲需要填歌名跟原曲網址';
      errEl.style.display = 'block';
      return;
    }
    if(selectedSongs.length >= 3){
      errEl.textContent = '最多只能選3首歌';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    addSelectedSong({ title: title, url: url });
    document.getElementById('customSongTitle').value = '';
    document.getElementById('customSongUrl').value = '';
  });

  // ---------- date list (customer facing) ----------
  function renderDateList(){
    var el = document.getElementById('dateList');
    var reservedDates = {};
    Object.keys(reservations).forEach(function(id){ reservedDates[reservations[id].date] = true; });
    var opened = Object.keys(openDates).sort();
    var available = opened.filter(function(d){ return !reservedDates[d]; });
    if(opened.length===0){
      el.innerHTML = '<span style="color:var(--parchment-dim);font-size:14px;">目前沒有開放的預約日期</span>';
      document.getElementById('bookingForm').style.display = 'none';
      selectedDate = null;
      renderMaidOptions();
      renderTodayStaff();
      return;
    }
    if(available.length===0){
      el.innerHTML = '<div class="full-notice" role="status"><strong>本次營業時段預約已額滿</strong><span>感謝您的關注，下一次預約開放資訊請留意官方公告。</span></div>';
      document.getElementById('bookingForm').style.display = 'none';
      selectedDate = null;
      renderMaidOptions();
      renderTodayStaff();
      return;
    }
    var html = '';
    available.forEach(function(d){
      html += '<span class="chip" data-date="'+d+'">'+d+'</span>';
    });
    el.innerHTML = html;
    el.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        selectedDate = chip.getAttribute('data-date');
        selectedSongs = [];
        renderMaidOptions();
        renderTodayStaff();
        document.getElementById('selectedDateLabel').textContent = selectedDate;
        document.getElementById('bookingForm').style.display = 'block';
        document.getElementById('bookingError').style.display = 'none';
        renderSelectedSongs();
        document.getElementById('bookingForm').scrollIntoView({behavior:'smooth', block:'center'});
      });
    });
  }

  document.getElementById('cancelBookingForm').addEventListener('click', function(){
    document.getElementById('bookingForm').style.display = 'none';
    selectedDate = null;
    selectedSongs = [];
    renderMaidOptions();
    renderTodayStaff();
  });

  document.getElementById('submitBooking').addEventListener('click', function(){
    if(!isConfigured || !selectedDate) return;
    var name = document.getElementById('bookName').value.trim();
    var size = parseInt(document.getElementById('bookSizeInput').value, 10);
    var maid = document.getElementById('bookMaid').value;
    var note = document.getElementById('bookNote').value.trim();
    var errEl = document.getElementById('bookingError');
    if(!name || !size || size < 1){
      errEl.textContent = '請填寫角色名跟人數';
      errEl.style.display = 'block';
      return;
    }
    if(maid){
      var schedule = staffSchedules[selectedDate];
      if(!schedule && todayStaff.date===selectedDate) schedule = todayStaff;
      if(schedule && Array.isArray(schedule.staffIds)){
        var maidStillAvailable = schedule.staffIds.some(function(id){ return staffRoster[id] && staffRoster[id].name===maid; });
        if(!maidStillAvailable){
          errEl.textContent = '這位女僕目前不在此日期的排班中，請重新選擇';
          errEl.style.display = 'block';
          renderMaidOptions();
          return;
        }
      }
    }
    reservationsRef.once('value').then(function(snap){
      var current = snap.val() || {};
      var taken = Object.keys(current).some(function(id){ return current[id].date === selectedDate; });
      if(taken){
        errEl.textContent = '不好意思，這個日期剛好被別人預約走了，請選別的日期';
        errEl.style.display = 'block';
        selectedDate = null;
        document.getElementById('bookingForm').style.display = 'none';
        return;
      }
      var id = reservationsRef.push().key;
      reservationsRef.child(id).set({
        date: selectedDate,
        name: name,
        size: size,
        maid: maid,
        note: note,
        songs: selectedSongs,
        createdAt: Date.now()
      });
      var songLines = selectedSongs.length ? selectedSongs.map(function(s){ return '・'+s.title; }).join('\n') : '（未選歌曲）';
      sendDiscordNotification('新的預約通知\n'+selectedDate+' ｜ '+name+' ｜ '+size+'位'+(maid?' ｜ 指名：'+maid:'')+(note?' ｜ '+note:'')+'\n點歌：\n'+songLines);
      document.getElementById('bookName').value = '';
      document.getElementById('bookSizeInput').value = '';
      document.getElementById('bookMaid').value = '';
      document.getElementById('bookNote').value = '';
      document.getElementById('bookingForm').style.display = 'none';
      errEl.style.display = 'none';
      selectedDate = null;
      selectedSongs = [];
      renderMaidOptions();
      renderTodayStaff();
    });
  });

  function sendDiscordNotification(text){
    if(!webhookUrl) return;
    fetch(webhookUrl, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content: text})
    }).catch(function(){});
  }

  renderSelectedSongs();
  renderTodayStaff();
})();
</script>

</body>
</html>
